<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<title>Sudoku</title>
<!-- Anti-flash: aplica o tema salvo (dn-theme) ou a preferência do sistema antes da primeira pintura -->
<script>(function(){try{var t=localStorage.getItem('dn-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}catch(e){}})()</script>
<!-- Identidade oficial EXECUTIVE DIGITAL (arquivos do site pessoal, sem alterações) -->
<link rel="icon" href="https://eliseuangelos.github.io/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://eliseuangelos.github.io/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="day-night/day-night.css?v=1">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<button id="menuBtn" class="icon-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<header class="top">
  <div class="brand"><img src="https://eliseuangelos.github.io/assets/icons/brand-symbol.svg" alt="" width="32" height="32"><h1>Sudoku</h1></div>
  <div class="meta"><span id="levelLabel">FÁCIL</span><span id="timer" aria-label="Tempo de jogo">00:00:00</span><div id="alternador"></div></div>
</header>
<div class="prog"><span id="progTxt">PROGRESSO: 0 / 0</span><i><b id="progBar"></b></i></div>
<main>
  <div id="board" class="board" role="group" aria-label="Tabuleiro de Sudoku"></div>
  <div id="pad" class="pad" aria-label="Teclado numérico"></div>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>
</main>
<footer class="site-footer">
  <p>Desenvolvido por <a href="https://eliseuangelos.github.io/" target="_blank" rel="noopener noreferrer">Eliseu Fernandes Laurindo</a></p>
  <p>© <span data-current-year></span> Eliseu Fernandes Laurindo. Todos os direitos reservados.</p>
</footer>
<div id="scrim" class="scrim"></div>
<nav id="drawer" class="drawer" aria-label="Menu principal" inert>
  <div class="drawer-head"><img src="https://eliseuangelos.github.io/assets/icons/brand-symbol.svg" alt="" width="32" height="32"><div><h2>Sudoku</h2><small>Menu de navegação</small></div></div>
  <section class="grp" aria-labelledby="g-partida"><h3 id="g-partida">Partida</h3>
    <button data-a="new">Novo Sudoku</button>
    <button data-a="restart">Reiniciar Sudoku atual</button>
  </section>
  <section class="grp" aria-labelledby="g-nivel"><h3 id="g-nivel">Dificuldade</h3>
    <div class="seg" role="group" aria-label="Dificuldade">
      <button data-lv="1">Fácil</button><button data-lv="2">Médio</button><button data-lv="3">Difícil</button>
    </div>
  </section>
  <section class="grp" aria-labelledby="g-ajuda"><h3 id="g-ajuda">Ajuda no jogo</h3>
    <button data-a="notes" id="notesBtn" aria-pressed="false">Modo anotações: desligado</button>
    <button data-a="hint">Revelar uma resposta</button>
    <button data-a="check">Verificar erros</button>
    <button data-a="solve">Revelar solução completa</button>
  </section>
  <section class="grp" aria-labelledby="g-ferr"><h3 id="g-ferr">Ferramentas</h3>
    <button data-a="print">Imprimir Sudoku</button>
    <button data-a="clear">Apagar meus números</button>
  </section>
  <section class="grp" aria-labelledby="g-info"><h3 id="g-info">Informações</h3>
    <button data-a="how">Como jogar</button>
    <button data-a="credits">Créditos</button>
  </section>
  <p class="credit">Desenvolvido por <a href="https://eliseuangelos.github.io/" target="_blank" rel="noopener noreferrer">Eliseu Fernandes Laurindo</a></p>
</nav>
<button id="closeBtn" class="icon-btn x" aria-label="Fechar menu" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<dialog id="dlg"></dialog>
<div id="printArea" aria-hidden="true"></div>
<script src="sudoku-engine.js?v=10"></script>
<script src="sudoku-game.js?v=10"></script>
<script src="app.js?v=10"></script>
<script src="day-night/day-night.js?v=1"></script>
<script>
DayNight.init({target:'#alternador'});
/* a cor da barra do navegador acompanha o tema */
(function(){var m=document.querySelector('meta[name=theme-color]'),r=document.documentElement;function u(){m.content=getComputedStyle(r).getPropertyValue('--color-theme-meta').trim()}u();addEventListener('daynight:change',u);document.addEventListener('daynight:change',u)})();
document.querySelectorAll('[data-current-year]').forEach(function(e){e.textContent=new Date().getFullYear()});
</script>
</body>
</html>
